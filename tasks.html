<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manage your daily tasks with priorities, deadlines, and completion tracking"
    />
    <title>Tasks - Smart Daily Planner</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/tasks.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <span class="logo-icon">📊</span>
          <span>Smart Planner</span>
        </div>

        <nav class="nav">
          <a href="index.html" class="nav-link">Dashboard</a>
          <a href="tasks.html" class="nav-link active">Tasks</a>
          <a href="expenses.html" class="nav-link">Expenses</a>
        </nav>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <h1 class="page-title">Task Management</h1>

      <!-- Task Statistics -->
      <div class="task-stats">
        <div class="stat-item">
          <span class="stat-value" id="total-tasks">0</span>
          <span class="stat-label">Total Tasks</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="active-tasks">0</span>
          <span class="stat-label">Active</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="completed-tasks">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </div>

      <!-- Task Controls -->
      <div class="task-controls">
        <div class="task-filters">
          <button class="filter-btn active" data-filter="all">All Tasks</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <button class="btn btn-primary" id="add-task-btn">
          ➕ Add New Task
        </button>
      </div>

      <!-- Task List -->
      <div id="task-list">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading tasks...</p>
        </div>
      </div>
    </main>

    <!-- Task Modal -->
    <div class="modal-overlay" id="task-modal">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-title">Add New Task</h2>
          <button class="modal-close" aria-label="Close modal">&times;</button>
        </div>
        <div class="modal-body">
          <form id="task-form">
            <!-- Task Title -->
            <div class="form-group">
              <label for="task-title" class="form-label">Task Title *</label>
              <input
                type="text"
                id="task-title"
                class="form-input"
                placeholder="Enter task title"
                maxlength="100"
                required
              />
              <span class="form-error"></span>
            </div>

            <!-- Task Description -->
            <div class="form-group">
              <label for="task-description" class="form-label"
                >Description</label
              >
              <textarea
                id="task-description"
                class="form-textarea"
                placeholder="Enter task description (optional)"
                maxlength="500"
              ></textarea>
              <span class="form-error"></span>
            </div>

            <!-- Priority -->
            <div class="form-group">
              <label for="task-priority" class="form-label">Priority *</label>
              <select id="task-priority" class="form-select" required>
                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>
              </select>
              <span class="form-error"></span>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
              <button
                type="button"
                class="btn btn-outline"
                id="cancel-task-btn"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">Save Task</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer-text">
        © 2026 Smart Daily Planner. All rights reserved.
      </p>
    </footer>

    <!-- JavaScript -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tasks.js"></script>
  </body>
</html>
